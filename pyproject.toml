[project]
name = "trace-api"
version = "0.1.0"
description = "TRACE backend: incident investigation and change-impact API and worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "cryptography>=42",
  "neo4j>=5.20",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["db: needs a reachable Postgres (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() defaults are the framework idiom

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/graph/ontology.py" = ["E501"]  # the ontology is a table; one spec per line reads best
"app/graph/*.py" = ["E501"]  # Cypher strings stay on one line so templates read as written
